# The Last Cartographer: tests, the Windows build, a smoke run of that build, and (on a version tag) Steam.
# docs/design/build-pipeline.md explains each job and the secrets it needs.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'     # the week's build (PRO-02): Mondays 06:00 UTC, tests, build and smoke run

# The test runner posts its results as a check run; the repository's default token may only read.
permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.7f1
  PROJECT_PATH: LastCartographer
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  tests:
    name: Tests (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: LastCartographer/Library
          key: Library-${{ matrix.mode }}-${{ hashFiles('LastCartographer/Packages/packages-lock.json', 'LastCartographer/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.mode }}-
      # The editor image is over ten gigabytes and the hosted runner has about fourteen free: the first run died
      # pulling it ("no space left on device"). The preinstalled toolchains the game doesn't use go first.
      - name: Free the runner's disk for the editor image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          # Unity 6 on Linux segfaults in ScriptingCoverage during the play-mode assembly reload (the third run,
          # 2026-09-29), so coverage stays off. The action's coverageEnabled input reaches the CLI as
          # --no-coverageEnabled, which the CLI's parser refuses ("Unknown argument", the fourth run); the CLI reads
          # its options from GAME_CI_* variables too, and this one it takes.
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.mode }}
          # Our play tests only: the Input System is testable (for its fixture) and would bring its own.
          customParameters: ${{ matrix.mode == 'playmode' && '-assemblyNames OWSBG.Tests.PlayMode' || '' }}
          artifactsPath: test-results-${{ matrix.mode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results (${{ matrix.mode }})
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.mode }}
          path: ${{ steps.tests.outputs.artifactsPath }}

  build-windows:
    name: Windows build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0          # git describe names the version
      - uses: actions/cache@v4
        with:
          path: LastCartographer/Library
          key: Library-Windows-${{ hashFiles('LastCartographer/Packages/packages-lock.json', 'LastCartographer/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Windows-
      # The editor image is over ten gigabytes and the hosted runner has about fourteen free: the first run died
      # pulling it ("no space left on device"). The preinstalled toolchains the game doesn't use go first.
      - name: Free the runner's disk for the editor image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /
      # v6 wraps GameCI's CLI, which signs the editor in with UNITY_EMAIL and UNITY_PASSWORD as the test runner
      # does; v4 demanded a licence file, which a Personal seat can no longer get (the seventh run).
      - uses: game-ci/unity-builder@v6
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: LastCartographer
          buildMethod: OWSBG.Build.GameBuild.BuildFromCommandLine
          versioning: Semantic
          # Where the upload below looks, whatever path the CLI passes itself: GameBuild takes the last one given.
          customParameters: -buildOutput /github/workspace/build/StandaloneWindows64
      - uses: actions/upload-artifact@v4
        with:
          name: LastCartographer-Windows
          path: build/StandaloneWindows64
          retention-days: 14

  smoke-windows:
    name: Smoke run (Windows)
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/download-artifact@v4
        with:
          name: LastCartographer-Windows
          path: build
      - name: Boot the build, walk two rooms, start a conversation
        shell: pwsh
        run: ./tools/smoke.ps1 -Exe build/LastCartographer.exe -Log smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log
          path: smoke.log

  steam:
    name: Steam upload
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke-windows
    runs-on: ubuntu-latest
    environment: steam
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LastCartographer-Windows
          path: build
      - uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ vars.STEAM_APP_ID }}
          buildDescription: ${{ github.ref_name }}
          rootPath: build
          depot1Path: .
          releaseBranch: ${{ vars.STEAM_BRANCH || 'beta' }}
