# One-off: request a Unity activation file (.alf) for this editor version, to turn into the UNITY_LICENSE secret.
# Run it from the Actions tab (workflow_dispatch), download the artifact, and follow docs/design/build-pipeline.md
# "Secrets and variables to set". It needs no secrets itself.
name: Unity activation file

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: alf
        with:
          unityVersion: 6000.3.7f1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.alf.outputs.filePath }}
          path: ${{ steps.alf.outputs.filePath }}
          retention-days: 3
